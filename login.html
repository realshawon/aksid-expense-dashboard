<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKSID Expense — Sign in</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f5f6fa; color:#1d1d1f; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .card { width:100%; max-width:410px; background:#fff; border-radius:14px; padding:2rem; box-shadow:0 8px 32px rgba(0,0,0,.08); }
  .logo { height:34px; margin-bottom:1.1rem; }
  h1 { font-size:1.4rem; margin:0 0 .25rem; }
  p.sub { margin:0 0 1.4rem; color:#6b6b70; font-size:.92rem; line-height:1.5; }
  label { display:block; font-size:.85rem; color:#333; margin:.9rem 0 .35rem; }
  input { width:100%; padding:.7rem .8rem; border:1px solid #d6dae1; border-radius:9px; font-size:1rem; background:#fafbfc; font-family:inherit; }
  input:focus { outline:none; border-color:#2a6df4; background:#fff; }
  button { width:100%; margin-top:1.3rem; padding:.8rem; background:#2a6df4; color:#fff; border:none; border-radius:9px; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; }
  button:disabled { background:#9ca3af; cursor:wait; }
  .err { margin-top:1rem; padding:.7rem .8rem; background:#fdeced; border:1px solid #f5c2c7; color:#a3242e; border-radius:9px; font-size:.88rem; display:none; }
  .foot { margin-top:1.2rem; font-size:.78rem; color:#8a8a8f; text-align:center; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://images.squarespace-cdn.com/content/v1/61b1d88771230e2244b14213/de522f80-4556-42c4-af20-e3687e746991/AKSID-HORIZONTAL-LOGO.png?format=750w" alt="AKSID">
    <h1>Expense — Sign in</h1>
    <p class="sub">Use the same Employee ID or email and password you use on <b>erp.aksidcorp.com</b>. This app has no separate password.</p>

    <form id="f" autocomplete="on">
      <label for="identifier">Employee ID or Email</label>
      <input id="identifier" name="username" type="text" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button id="btn" type="submit">Sign in</button>
    </form>

    <div id="err" class="err"></div>

    <p class="foot">Forgot your password? Ask HR to reset it in the ERP — it will work here immediately.</p>
  </div>

<script>
// `next` is where we return the user after a successful sign-in — typically the
// approval page they clicked through to from an email. Only same-origin paths
// are accepted, so a crafted ?next= can't bounce anyone to another site.
function safeNext(){
  const raw = new URLSearchParams(location.search).get('next') || '/';
  if (!raw.startsWith('/') || raw.startsWith('//')) return '/';
  return raw;
}
// Already signed in? Go straight through.
fetch('/api/me').then(r => { if (r.ok) location.replace(safeNext()); });

const f = document.getElementById('f');
const btn = document.getElementById('btn');
const errBox = document.getElementById('err');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        identifier: document.getElementById('identifier').value,
        password: document.getElementById('password').value,
      }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'Sign in failed.');
    location.replace(safeNext());
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign in';
    document.getElementById('password').value = '';
  }
});
</script>
</body>
</html>
