<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKSID Expense — Add Attachment</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#f4f6f9;color:#1d1d1f;font-size:14px}
.wrap{max-width:520px;margin:0 auto;padding:20px}
.logo{height:40px;margin-bottom:14px}
.card{background:#fff;border:1px solid #e6e8ec;border-radius:14px;padding:20px}
h1{font-size:18px;margin:0 0 2px}.sub{color:#6b6b70;font-size:12.5px;margin:0 0 16px}
label{display:block;font-size:12px;color:#6b6b70;font-weight:600;margin:12px 0 4px}
input{width:100%;font:inherit;padding:9px 11px;border:1px solid #d6dae1;border-radius:9px;background:#fff}
button{width:100%;font:inherit;font-weight:700;border:none;border-radius:10px;padding:13px;cursor:pointer;background:#2a6df4;color:#fff;margin-top:18px}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13.5px;display:none}
.msg.ok{background:#e6f4ea;color:#226b39;display:block}.msg.err{background:#fdeced;color:#a3242e;display:block}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="https://images.squarespace-cdn.com/content/v1/61b1d88771230e2244b14213/de522f80-4556-42c4-af20-e3687e746991/AKSID-HORIZONTAL-LOGO.png?format=750w" alt="AKSID">
  <div class="card">
    <h1>Add Attachment to an Expense</h1>
    <p class="sub">Admin tool — attach a receipt/file to an existing expense by ID or ref.</p>
    <label>Expense ID or Ref (e.g. 137 or EXP-1000137)</label>
    <input id="eid" placeholder="137">
    <label>Admin Key</label>
    <input id="key" type="password" placeholder="Admin key">
    <label>File</label>
    <input id="file" type="file" accept="image/*,.pdf">
    <button id="btn" onclick="upload()">Upload</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
function readFileB64(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(file);});}
async function upload(){
  const m=document.getElementById('msg');const btn=document.getElementById('btn');
  let eid=(document.getElementById('eid').value||'').trim();
  const key=(document.getElementById('key').value||'').trim();
  const fi=document.getElementById('file');
  const f=fi.files&&fi.files[0];
  if(eid.toUpperCase().startsWith('EXP-'))eid=String(parseInt(eid.replace(/\D/g,''))-1000000);
  if(!eid||!key||!f){m.className='msg err';m.style.display='block';m.textContent='Fill in the expense ID, admin key, and choose a file.';return;}
  btn.disabled=true;m.className='msg';m.style.display='block';m.textContent='Uploading…';
  try{
    const b64=await readFileB64(f);
    const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'addAttachment',id:eid,key,file_base64:b64,filename:f.name,content_type:f.type||'application/octet-stream'})});
    const d=await r.json();
    if(!d.ok){m.className='msg err';m.textContent=d.error||'Failed';btn.disabled=false;return;}
    m.className='msg ok';m.innerHTML='✅ Attached to <b>'+(d.expense.ref||('#'+eid))+'</b>. <a href="'+d.url+'" target="_blank">View file ↗</a>';
  }catch(e){m.className='msg err';m.textContent=String(e);}
  btn.disabled=false;
}
</script>
</body>
</html>
